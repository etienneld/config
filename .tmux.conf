unbind-key C-b
set -g prefix '`'
bind-key '`' last-window
bind-key p send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 5000

setw -g mode-keys vi
set -s extended-keys on
set -g xterm-keys on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style 'bg=#1e1e1e,fg=#a0a0a0'

set -g status-left ''

set -g window-status-separator ''
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '

set -g window-status-style 'fg=#808080,bg=#1e1e1e'
set -g window-status-current-style 'fg=#ffffff,bg=#404040,bold'

set -g status-right-length 40
set -g status-right '#[fg=#888888]%Y-%m-%d #[fg=#dddddd]%H:%M:%S'

set -g allow-passthrough on
